<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fitness Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d0d0d;--s1:#161616;--s2:#1f1f1f;--s3:#272727;
  --t1:#efefef;--t2:#888;--t3:#444;
  --ac:#c8f043;--bl:#4fa8ff;--or:#ff8c42;--pu:#b87fff;--rd:#ff5555;--gr:#4fff8c;
  --brd:#242424;--r:11px;--r2:7px;
}
html,body{
  background:var(--bg);
  color:var(--t1);
  font-family:'Syne',sans-serif;
  font-size:14px;
  line-height:1.4;
  width:100%;
  height:100%;
  overflow:hidden;
}
.shell{
  width:100%;
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}
.scroll-area{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.scroll-area::-webkit-scrollbar{display:none}
.tab{display:none;padding-bottom:24px}
.tab.active{display:block}
.tabbar{
  background:var(--s1);
  border-top:1px solid var(--brd);
  display:flex;
  align-items:center;
  flex-shrink:0;
  padding-bottom:env(safe-area-inset-bottom);
}
.tb{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  background:none;
  border:none;
  color:var(--t3);
  font-size:10px;
  font-family:'Syne',sans-serif;
  cursor:pointer;
  padding:10px 0 8px;
  transition:color .15s;
}
.tb.on{color:var(--ac)}
.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}
.hdr{padding:18px 16px 10px;display:flex;justify-content:space-between;align-items:center}
.pg-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.chip{background:var(--s2);border:1px solid var(--brd);border-radius:20px;padding:4px 11px;font-size:11px;color:var(--t2);font-family:'DM Mono',monospace}
.sec{padding:8px 16px}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--t3);text-transform:uppercase;margin-bottom:8px}
.streak{background:var(--s1);border:1px solid var(--ac);border-radius:var(--r);padding:14px 16px;margin:0 16px 12px;display:flex;align-items:center;gap:14px}
.str-n{font-size:40px;font-weight:800;color:var(--ac);font-family:'DM Mono',monospace;line-height:1}
.str-lbl{font-size:14px;font-weight:700}
.str-sub{font-size:11px;color:var(--t2);margin-top:2px}
.cpgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cp{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r);padding:13px 12px;cursor:pointer;position:relative;transition:border-color .15s,background .15s;min-height:80px}
.cp.done{border-color:var(--ac);background:#101a00}
.cp-ico{font-size:20px;margin-bottom:6px}
.cp-nm{font-size:12px;font-weight:700;line-height:1.2}
.cp-sb{font-size:10px;color:var(--t2);margin-top:2px}
.cp-ck{position:absolute;top:8px;right:8px;width:17px;height:17px;border-radius:50%;background:var(--ac);display:none;align-items:center;justify-content:center;font-size:9px;color:#000;font-weight:900}
.cp.done .cp-ck{display:flex}
.water-card{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r);padding:14px;margin:0 16px}
.wt-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wt-nm{font-size:13px;font-weight:600}
.wt-ct{font-size:22px;font-weight:800;color:var(--bl);font-family:'DM Mono',monospace}
.glasses{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.gl{width:34px;height:34px;border-radius:6px;border:1.5px solid var(--brd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s}
.gl.on{border-color:var(--bl);background:rgba(79,168,255,.12)}
.row2{display:flex;gap:8px}
.btn{flex:1;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r2);padding:9px 8px;color:var(--t1);font-family:'Syne',sans-serif;font-size:12px;cursor:pointer;transition:all .15s;text-align:center}
.btn:active{opacity:.7}
.btn.ac{border-color:var(--ac);color:var(--ac)}
.btn.pri{background:var(--ac);color:#000;border-color:var(--ac);font-weight:700}
.btn.sm{padding:6px 10px;font-size:10px;flex:none}
.wo-item{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .15s;margin:0 16px}
.wo-item+.wo-item{margin-top:8px}
.wo-item.logged{border-color:var(--ac)}
.wo-bar{width:4px;height:40px;border-radius:3px;flex-shrink:0}
.wo-inf{flex:1;min-width:0}
.wo-nm{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wo-mt{font-size:11px;color:var(--t2);margin-top:2px}
.wo-ck{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brd);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.wo-item.logged .wo-ck{background:var(--ac);border-color:var(--ac)}
.wo-ck svg{width:12px;height:12px;stroke-width:2.5;fill:none;stroke:var(--t3)}
.wo-item.logged .wo-ck svg{stroke:#000}
.add-row{margin:8px 16px 0;background:var(--s2);border:1px dashed var(--brd);border-radius:var(--r);padding:13px;text-align:center;font-size:12px;color:var(--t2);cursor:pointer}
.wcard{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r);margin:0 16px 10px;padding:14px}
.wbig{font-size:36px;font-weight:800;font-family:'DM Mono',monospace;line-height:1}
.wunit{font-size:13px;color:var(--t2);font-weight:400}
.wdiff{font-size:11px;margin-top:3px}
.wdiff.dn{color:var(--gr)}.wdiff.up{color:var(--rd)}
.prog{height:5px;background:var(--s3);border-radius:3px;overflow:hidden;margin:11px 0 9px}
.progf{height:100%;border-radius:3px;background:var(--ac);transition:width .5s}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mstat{background:var(--s2);border-radius:var(--r2);padding:9px;text-align:center}
.mstat .ml{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px}
.mstat .mv{font-size:13px;font-weight:700;font-family:'DM Mono',monospace;margin-top:2px}
.chart-w{height:90px;position:relative;margin-top:10px}
.chart-w canvas{position:absolute;inset:0;width:100%;height:100%}
.we-list{margin:0 16px;display:flex;flex-direction:column;gap:6px}
.we{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r2);padding:10px 13px;display:flex;justify-content:space-between;align-items:center}
.we-d{font-size:11px;color:var(--t2)}
.we-v{font-size:14px;font-weight:700;font-family:'DM Mono',monospace;color:var(--ac)}
.we-x{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;padding:2px 6px}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 16px}
.sc{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r);padding:14px}
.sv{font-size:28px;font-weight:800;font-family:'DM Mono',monospace;line-height:1}
.sl{font-size:10px;color:var(--t2);margin-top:4px;text-transform:uppercase;letter-spacing:.7px}
.wk-item{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r2);padding:9px 13px;display:flex;align-items:center;gap:10px}
.wk-item+.wk-item{margin-top:6px}
.wk-d{font-size:11px;color:var(--t2);min-width:30px}
.wk-bw{flex:1;height:5px;background:var(--s3);border-radius:3px;overflow:hidden}
.wk-bf{height:100%;border-radius:3px;transition:width .4s}
.wk-ct{font-size:11px;color:var(--t2);min-width:28px;text-align:right}
.wk-w{font-size:11px;color:var(--bl);min-width:24px;text-align:right}
.inp{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r2);padding:11px 13px;color:var(--t1);font-family:'DM Mono',monospace;font-size:18px;outline:none;text-align:center}
.inp:focus{border-color:var(--ac)}
.ir{margin-bottom:10px}
.ir label{font-size:11px;color:var(--t2);display:block;margin-bottom:5px}
.ir input{width:100%;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r2);padding:10px 12px;color:var(--t1);font-family:'Syne',sans-serif;font-size:13px;outline:none}
.ir input:focus{border-color:var(--ac)}
.cpks{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cpk{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.cpk.sel{border-color:#fff}
.mbtns{display:flex;gap:8px;margin-top:12px}
.cp-mi{background:var(--s1);border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;gap:10px;margin:0 16px}
.cp-mi+.cp-mi{margin-top:7px}
.cp-mi-ico{font-size:18px;flex-shrink:0}
.cp-mi-inf{flex:1}
.cp-mi-nm{font-size:13px;font-weight:700}
.cp-mi-sb{font-size:10px;color:var(--t2)}
.cp-mi-del{background:none;border:1px solid var(--brd);border-radius:var(--r2);padding:5px 10px;color:var(--rd);font-size:11px;cursor:pointer;flex-shrink:0}
.emo-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.ep{width:34px;height:34px;border-radius:7px;background:var(--s2);border:1px solid var(--brd);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.ep.sel{border-color:var(--ac)}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--bl);font-family:'Syne',sans-serif;font-size:13px;cursor:pointer;padding:0}
.back-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
</style>
</head>
<body>
<div class="shell">
  <div class="scroll-area" id="scrollArea">

    <!-- TODAY -->
    <div class="tab active" id="tab-today">
      <div class="hdr">
        <div class="pg-title" id="greeting">Good morning 💪</div>
        <div class="chip" id="datechip">Jun 9</div>
      </div>
      <div class="streak">
        <div class="str-n" id="strNum">0</div>
        <div>
          <div class="str-lbl">Day Streak 🔥</div>
          <div class="str-sub" id="strSub">Complete all checkpoints!</div>
        </div>
      </div>
      <div class="sec">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div class="sec-lbl" style="margin:0">Daily Checkpoints</div>
          <button class="btn sm" onclick="openManageCp()">Manage</button>
        </div>
        <div class="cpgrid" id="cpGrid"></div>
      </div>
      <div class="sec" style="padding-bottom:0"><div class="sec-lbl">Water Intake</div></div>
      <div class="water-card">
        <div class="wt-top"><div class="wt-nm">Glasses today</div><div class="wt-ct" id="wCt">0/8</div></div>
        <div class="glasses" id="glGrid"></div>
        <div class="row2">
          <button class="btn ac" onclick="addW()">+ Glass</button>
          <button class="btn" onclick="remW()">− Remove</button>
        </div>
      </div>
    </div>

    <!-- WORKOUTS -->
    <div class="tab" id="tab-workouts">
      <div class="hdr"><div class="pg-title">Workouts</div></div>
      <div id="woList"></div>
      <div class="add-row" onclick="openAddWo()">+ Add Workout</div>
    </div>

    <!-- WEIGHT -->
    <div class="tab" id="tab-weight">
      <div class="hdr"><div class="pg-title">Weight</div></div>
      <div class="wcard">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="wbig"><span id="curWt">--</span><span class="wunit"> kg</span></div>
            <div class="wdiff" id="wtDiff"></div>
          </div>
          <div style="text-align:right">
            <div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px">Goal</div>
            <div style="font-size:18px;font-weight:700;color:var(--or);font-family:'DM Mono',monospace"><span id="tgtWt">--</span> kg</div>
          </div>
        </div>
        <div class="prog"><div class="progf" id="progF" style="width:0%"></div></div>
        <div class="mini3">
          <div class="mstat"><div class="ml">Start</div><div class="mv" id="stWt">--</div></div>
          <div class="mstat"><div class="ml">Left</div><div class="mv" style="color:var(--or)" id="leftWt">--</div></div>
          <div class="mstat"><div class="ml">Done</div><div class="mv" style="color:var(--ac)" id="pctD">--%</div></div>
        </div>
        <div class="chart-w"><canvas id="wtC"></canvas></div>
      </div>
      <div style="display:flex;gap:8px;margin:0 16px 10px">
        <button class="btn ac" style="flex:1" onclick="openLogWt()">+ Log Weight</button>
        <button class="btn" style="flex:1" onclick="openSetTgt()">Set Target</button>
      </div>
      <div class="sec"><div class="sec-lbl">Weekly Log</div></div>
      <div class="we-list" id="weList"></div>
    </div>

    <!-- STATS -->
    <div class="tab" id="tab-stats">
      <div class="hdr"><div class="pg-title">Stats</div></div>
      <div class="stats2">
        <div class="sc"><div class="sv" style="color:var(--ac)" id="ss1">0</div><div class="sl">Streak</div></div>
        <div class="sc"><div class="sv" style="color:var(--bl)" id="ss2">0</div><div class="sl">Workouts</div></div>
        <div class="sc"><div class="sv" style="color:var(--or)" id="ss3">0</div><div class="sl">Water glasses</div></div>
        <div class="sc"><div class="sv" style="color:var(--pu)" id="ss4">0</div><div class="sl">Checkpoints</div></div>
      </div>
      <div class="sec" style="margin-top:10px"><div class="sec-lbl">This Week</div><div id="wkGrid"></div></div>
    </div>

    <!-- MODAL TAB -->
    <div class="tab" id="tab-modal">
      <div class="hdr" style="padding-bottom:6px">
        <button class="back-btn" onclick="closeModal()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
      </div>
      <div style="padding:0 16px 10px;font-size:18px;font-weight:800;letter-spacing:-.3px" id="mTitle"></div>
      <div id="mBody"></div>
    </div>

  </div>

  <div class="tabbar">
    <button class="tb on" id="nav-today" onclick="go('today',this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Today
    </button>
    <button class="tb" id="nav-workouts" onclick="go('workouts',this)">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
      Workouts
    </button>
    <button class="tb" id="nav-weight" onclick="go('weight',this)">
      <svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 014 4v1h2a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2v-9a2 2 0 012-2h2V7a4 4 0 014-4z"/></svg>
      Weight
    </button>
    <button class="tb" id="nav-stats" onclick="go('stats',this)">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Stats
    </button>
  </div>
</div>

<script>
const DCPS=[
  {id:'workout',icon:'🏋️',name:'Workout',sub:'Hit the gym'},
  {id:'meditate',icon:'🧘',name:'Meditation',sub:'Clear your mind'},
  {id:'reading',icon:'📖',name:'Reading',sub:'Learn something'},
  {id:'sleep',icon:'😴',name:'Sleep 7h+',sub:'Rest well'},
  {id:'eating',icon:'🥗',name:'Clean Eating',sub:'Skip the junk'},
  {id:'steps',icon:'👟',name:'10k Steps',sub:'Stay active'},
];
const COLS=['#c8f043','#4fa8ff','#ff8c42','#b87fff','#ff5555','#4fff8c'];
const EMOS=['🏋️','🧘','📖','😴','🥗','👟','🏃','💊','🚴','🥤','🎯','💪','🧠','🌿','⚡','🔥','🛌','🚶','🧗','🏊'];
let SC='#c8f043', prevTab='today', selEmo='⭐';

function gs(){try{return JSON.parse(localStorage.getItem('fitv4')||'{}')}catch{return{}}}
function sv(s){localStorage.setItem('fitv4',JSON.stringify(s))}
function today(){return new Date().toISOString().slice(0,10)}

function init(){
  let s=gs();
  if(!s.workouts)s.workouts=[
    {id:1,name:'Push Day',meta:'Chest · Shoulders · Triceps',color:'#c8f043'},
    {id:2,name:'Pull Day',meta:'Back · Biceps',color:'#4fa8ff'},
    {id:3,name:'Leg Day',meta:'Quads · Hamstrings · Calves',color:'#ff8c42'},
    {id:4,name:'Core & Cardio',meta:'Abs · 30min run',color:'#b87fff'},
  ];
  if(!s.checkpoints)s.checkpoints=JSON.parse(JSON.stringify(DCPS));
  if(!s.days)s.days={};
  if(!s.wtLog)s.wtLog=[];
  if(!s.tgt)s.tgt=null;
  if(!s.startWt)s.startWt=null;
  if(s.totW===undefined)s.totW=0;
  if(s.totCp===undefined)s.totCp=0;
  if(s.totWo===undefined)s.totWo=0;
  if(s.streak===undefined)s.streak=0;
  if(!s.lastDay)s.lastDay='';
  const t=today();
  if(!s.days[t])s.days[t]={cp:{},water:0,wo:[]};
  sv(s);return s;
}

let S=init();
function D(){const t=today();if(!S.days[t])S.days[t]={cp:{},water:0,wo:[]};return S.days[t];}

function go(pg,btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-'+pg).classList.add('active');
  if(btn)btn.classList.add('on');
  document.getElementById('scrollArea').scrollTop=0;
  if(pg==='stats')rStats();
  if(pg==='weight')rWeight();
}

function openModal(title,bodyFn,from){
  prevTab=from||'today';
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML='';
  bodyFn();
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  document.getElementById('tab-modal').classList.add('active');
  document.getElementById('scrollArea').scrollTop=0;
}

function closeModal(){
  go(prevTab,document.getElementById('nav-'+prevTab));
  if(prevTab==='weight')rWeight();
  if(prevTab==='workouts')rWo();
  if(prevTab==='today'){rCp();rWater();}
}

function rHeader(){
  const n=new Date(),h=n.getHours();
  document.getElementById('greeting').textContent=h<12?'Good morning 💪':h<17?'Good afternoon ⚡':'Good evening 🌙';
  const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('datechip').textContent=ms[n.getMonth()]+' '+n.getDate();
}

function rCp(){
  const d=D();
  document.getElementById('cpGrid').innerHTML=(S.checkpoints||[]).map(c=>`
    <div class="cp${d.cp[c.id]?' done':''}" onclick="toggleCp('${c.id}',this)">
      <div class="cp-ico">${c.icon}</div>
      <div class="cp-nm">${c.name}</div>
      <div class="cp-sb">${c.sub}</div>
      <div class="cp-ck">✓</div>
    </div>`).join('');
}

function toggleCp(id,el){
  const d=D();const was=d.cp[id];
  d.cp[id]=!was;
  if(!was)S.totCp++;else S.totCp=Math.max(0,S.totCp-1);
  checkStreak();sv(S);
  el.classList.toggle('done');
}

function checkStreak(){
  const d=D();const t=today();
  const total=(S.checkpoints||[]).length;
  const done=Object.values(d.cp||{}).filter(Boolean).length;
  if(done===total&&total>0&&S.lastDay!==t){S.streak++;S.lastDay=t;sv(S);}
  const n=S.streak||0;
  document.getElementById('strNum').textContent=n;
  document.getElementById('strSub').textContent=n===0?'Complete all checkpoints!':n===1?'First day! Keep going!':'Keep the streak alive!';
}

function rWater(){
  const d=D();const w=d.water||0;
  document.getElementById('wCt').textContent=w+'/8';
  document.getElementById('glGrid').innerHTML=Array.from({length:8},(_,i)=>
    `<div class="gl${i<w?' on':''}" onclick="setW(${i+1})">💧</div>`).join('');
}
function addW(){const d=D();if(d.water<8){d.water++;S.totW++;sv(S);rWater();}}
function remW(){const d=D();if(d.water>0){d.water--;S.totW=Math.max(0,S.totW-1);sv(S);rWater();}}
function setW(n){const d=D();const o=d.water||0;d.water=n;S.totW+=n-o;sv(S);rWater();}

function rWo(){
  const d=D();
  document.getElementById('woList').innerHTML=S.workouts.map(w=>`
    <div class="wo-item${d.wo.includes(w.id)?' logged':''}" onclick="togWo(${w.id},this)">
      <div class="wo-bar" style="background:${w.color}"></div>
      <div class="wo-inf"><div class="wo-nm">${w.name}</div><div class="wo-mt">${w.meta}</div></div>
      <div class="wo-ck"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
    </div>`).join('');
}
function togWo(id,el){
  const d=D();const i=d.wo.indexOf(id);
  if(i===-1){d.wo.push(id);S.totWo++;}else{d.wo.splice(i,1);S.totWo=Math.max(0,S.totWo-1);}
  sv(S);el.classList.toggle('logged');
}

function openAddWo(){
  openModal('Add Workout',()=>{
    document.getElementById('mBody').innerHTML=`
      <div style="padding:0 16px">
        <div class="ir"><label>Name</label><input id="wn" placeholder="Push Day" maxlength="30"/></div>
        <div class="ir"><label>Description</label><input id="wm" placeholder="Chest · Shoulders" maxlength="40"/></div>
        <div class="ir"><label>Color</label><div class="cpks">${COLS.map(c=>`<div class="cpk${c===SC?' sel':''}" style="background:${c}" onclick="pC('${c}',this)"></div>`).join('')}</div></div>
        <div class="mbtns">
          <button class="btn" style="flex:1" onclick="closeModal()">Cancel</button>
          <button class="btn pri" style="flex:1" onclick="saveWo()">Add</button>
        </div>
      </div>`;
  },'workouts');
}
function pC(c,el){SC=c;document.querySelectorAll('.cpk').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
function saveWo(){
  const n=document.getElementById('wn').value.trim();
  if(!n)return;
  S.workouts.push({id:Date.now(),name:n,meta:document.getElementById('wm').value.trim()||'Custom',color:SC});
  sv(S);closeModal();
}

function openManageCp(){
  openModal('Checkpoints',()=>renderManageBody(),'today');
}
function renderManageBody(){
  const list=(S.checkpoints||[]).map(c=>`
    <div class="cp-mi">
      <div class="cp-mi-ico">${c.icon}</div>
      <div class="cp-mi-inf"><div class="cp-mi-nm">${c.name}</div><div class="cp-mi-sb">${c.sub}</div></div>
      <button class="cp-mi-del" onclick="delCp('${c.id}')">Remove</button>
    </div>`).join('');
  document.getElementById('mBody').innerHTML=`
    <div style="margin-bottom:10px">${list}</div>
    <div class="add-row" onclick="showAddCpForm()">+ Add Checkpoint</div>
    <div id="addCpF" style="display:none;padding:10px 16px 0">
      <div class="ir">
        <label>Pick Icon</label>
        <div class="emo-pick">${EMOS.map(e=>`<div class="ep${e===selEmo?' sel':''}" onclick="pickEmo('${e}',this)">${e}</div>`).join('')}</div>
        <input id="cpIco" placeholder="or type emoji" maxlength="4" style="margin-top:8px;width:90px;background:var(--s2);border:1px solid var(--brd);border-radius:var(--r2);padding:8px;color:var(--t1);font-size:15px;outline:none;text-align:center"/>
      </div>
      <div class="ir"><label>Name</label><input id="cpNm" placeholder="e.g. Cold Shower" maxlength="25"/></div>
      <div class="ir"><label>Subtitle</label><input id="cpSb" placeholder="e.g. Build discipline" maxlength="35"/></div>
      <div class="mbtns">
        <button class="btn" style="flex:1" onclick="document.getElementById('addCpF').style.display='none'">Cancel</button>
        <button class="btn pri" style="flex:1" onclick="saveCp()">Add</button>
      </div>
    </div>`;
}
function showAddCpForm(){
  document.getElementById('addCpF').style.display='block';
  setTimeout(()=>document.getElementById('scrollArea').scrollTop=9999,50);
}
function pickEmo(e,el){
  selEmo=e;
  document.getElementById('cpIco').value=e;
  document.querySelectorAll('.ep').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');
}
function delCp(id){
  S.checkpoints=S.checkpoints.filter(c=>c.id!==id);
  sv(S);renderManageBody();
}
function saveCp(){
  const ico=document.getElementById('cpIco').value.trim()||selEmo;
  const nm=document.getElementById('cpNm').value.trim();
  const sb=document.getElementById('cpSb').value.trim();
  if(!nm)return;
  S.checkpoints.push({id:'cp_'+Date.now(),icon:ico,name:nm,sub:sb||'Daily habit'});
  sv(S);renderManageBody();
}

function rWeight(){
  const log=S.wtLog||[];const tgt=S.tgt;
  const cur=log.length?log[log.length-1].val:null;
  document.getElementById('curWt').textContent=cur?cur.toFixed(1):'--';
  document.getElementById('tgtWt').textContent=tgt?tgt.toFixed(1):'--';
  document.getElementById('stWt').textContent=S.startWt?S.startWt.toFixed(1):'--';
  if(cur&&tgt&&S.startWt){
    const total=S.startWt-tgt,done=S.startWt-cur;
    const pct=total===0?100:Math.min(100,Math.max(0,Math.round(done/total*100)));
    document.getElementById('progF').style.width=pct+'%';
    document.getElementById('pctD').textContent=pct+'%';
    document.getElementById('leftWt').textContent=Math.max(0,cur-tgt).toFixed(1);
    if(log.length>=2){
      const diff=(cur-log[log.length-2].val).toFixed(1);
      const el=document.getElementById('wtDiff');
      el.textContent=(parseFloat(diff)>0?'▲ +':'▼ ')+diff+' kg';
      el.className='wdiff '+(parseFloat(diff)>0?'up':'dn');
    }
  }else{
    document.getElementById('progF').style.width='0%';
    document.getElementById('pctD').textContent='--%';
    document.getElementById('leftWt').textContent='--';
    document.getElementById('wtDiff').textContent='';
  }
  const ms=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const ds=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const recent=[...log].reverse().slice(0,7);
  document.getElementById('weList').innerHTML=recent.length?recent.map(e=>{
    const d=new Date(e.date);
    return `<div class="we"><div class="we-d">${ds[d.getDay()]} ${d.getDate()} ${ms[d.getMonth()]}</div><div class="we-v">${e.val.toFixed(1)} kg</div><button class="we-x" onclick="delWt('${e.date}')">×</button></div>`;
  }).join(''):'<div style="text-align:center;padding:18px;color:var(--t3);font-size:12px">No entries yet</div>';
  setTimeout(()=>drawChart(log.slice(-7)),60);
}

function drawChart(data){
  const cv=document.getElementById('wtC');if(!cv||data.length<2)return;
  const ctx=cv.getContext('2d');
  const W=cv.offsetWidth||300,H=cv.offsetHeight||90;
  cv.width=W*2;cv.height=H*2;ctx.scale(2,2);
  const vals=data.map(d=>d.val),mn=Math.min(...vals)-.5,mx=Math.max(...vals)+.5;
  const px=i=>(i/(data.length-1))*(W-12)+6;
  const py=v=>H-6-((v-mn)/(mx-mn))*(H-12);
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='rgba(200,240,67,.1)';ctx.lineWidth=.8;
  [0,1,2].forEach(i=>{const y=6+(H-12)/2*i;ctx.beginPath();ctx.moveTo(6,y);ctx.lineTo(W-6,y);ctx.stroke();});
  ctx.beginPath();ctx.strokeStyle='#c8f043';ctx.lineWidth=1.5;ctx.lineJoin='round';
  data.forEach((d,i)=>i?ctx.lineTo(px(i),py(d.val)):ctx.moveTo(px(i),py(d.val)));ctx.stroke();
  ctx.fillStyle='rgba(200,240,67,.06)';ctx.beginPath();
  data.forEach((d,i)=>i?ctx.lineTo(px(i),py(d.val)):ctx.moveTo(px(i),py(d.val)));
  ctx.lineTo(px(data.length-1),H);ctx.lineTo(6,H);ctx.closePath();ctx.fill();
  data.forEach((d,i)=>{ctx.beginPath();ctx.arc(px(i),py(d.val),2.5,0,Math.PI*2);ctx.fillStyle='#c8f043';ctx.fill();});
}

function openLogWt(){
  openModal('Log Weight',()=>{
    document.getElementById('mBody').innerHTML=`
      <div style="padding:0 16px">
        <div style="text-align:center;color:var(--t2);font-size:12px;margin-bottom:13px">${today()}</div>
        <input class="inp" id="wtIn" type="number" step="0.1" min="20" max="300" placeholder="72.5"/>
        <div class="mbtns">
          <button class="btn" style="flex:1" onclick="closeModal()">Cancel</button>
          <button class="btn pri" style="flex:1" onclick="saveWt()">Save</button>
        </div>
      </div>`;
  },'weight');
}
function saveWt(){
  const v=parseFloat(document.getElementById('wtIn').value);
  if(isNaN(v)||v<=0)return;
  const t=today();
  const ei=S.wtLog.findIndex(e=>e.date===t);
  if(ei!==-1)S.wtLog[ei].val=v;else S.wtLog.push({date:t,val:v});
  S.wtLog.sort((a,b)=>a.date.localeCompare(b.date));
  if(!S.startWt)S.startWt=v;
  sv(S);closeModal();
}

function openSetTgt(){
  openModal('Monthly Target',()=>{
    document.getElementById('mBody').innerHTML=`
      <div style="padding:0 16px">
        <div style="color:var(--t2);font-size:12px;margin-bottom:13px">Target weight for this month</div>
        <input class="inp" id="tgtIn" type="number" step="0.1" min="20" max="300" placeholder="70.0" value="${S.tgt||''}"/>
        <div class="mbtns">
          <button class="btn" style="flex:1" onclick="closeModal()">Cancel</button>
          <button class="btn pri" style="flex:1" onclick="saveTgt()">Set</button>
        </div>
      </div>`;
  },'weight');
}
function saveTgt(){
  const v=parseFloat(document.getElementById('tgtIn').value);
  if(isNaN(v)||v<=0)return;
  S.tgt=v;sv(S);closeModal();
}
function delWt(date){S.wtLog=S.wtLog.filter(e=>e.date!==date);sv(S);rWeight();}

function rStats(){
  document.getElementById('ss1').textContent=S.streak||0;
  document.getElementById('ss2').textContent=S.totWo||0;
  document.getElementById('ss3').textContent=S.totW||0;
  document.getElementById('ss4').textContent=S.totCp||0;
  const last7=[];
  for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);last7.push(d.toISOString().slice(0,10));}
  const ds=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const total=(S.checkpoints||[]).length||1;
  document.getElementById('wkGrid').innerHTML=last7.map(date=>{
    const dy=S.days?.[date];
    const done=dy?Object.values(dy.cp||{}).filter(Boolean).length:0;
    const w=dy?.water||0;const pct=Math.round(done/total*100);
    const d=new Date(date);
    const clr=pct===100?'var(--ac)':pct>50?'var(--or)':'var(--s3)';
    return `<div class="wk-item"><div class="wk-d">${ds[d.getDay()]}</div><div class="wk-bw"><div class="wk-bf" style="width:${pct}%;background:${clr}"></div></div><div class="wk-ct">${done}/${total}</div><div class="wk-w">💧${w}</div></div>`;
  }).join('');
}

function render(){rHeader();rCp();rWater();rWo();checkStreak();}
render();

const now=new Date(),mid=new Date(now);
mid.setHours(24,0,0,0);
setTimeout(()=>{S=init();render();setInterval(()=>{S=init();render();},86400000);},mid-now);
</script>
